<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nirgunan</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- =====================================================
     WELCOME
===================================================== -->

<section id="welcome-screen"
         class="welcome-screen">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="grain"></div>

    <div class="welcome-content">

        <div class="gold-line"></div>

        <h1>
            Entha Mone,
            <span>Nirgunan here.</span>
        </h1>

        <p>
            The most useless AI to ever exist.
        </p>

        <button id="meet-button"
                class="meet-button">

            <span>MEET NIRGUNAN</span>

            <span class="arrow">
                →
            </span>

        </button>

    </div>

</section>



<!-- =====================================================
     CHAT
===================================================== -->

<section id="chat-screen"
         class="chat-screen hidden">


    <header class="header">

        <div>

            <div class="logo">
                NIRGUNAN
            </div>

            <div class="subtitle">
                Ask Nirgunan.
            </div>

        </div>


        <div class="online">

            <span></span>

            ONLINE

        </div>

    </header>



    <main id="chat-messages"
          class="chat-messages">

        <div class="message nirgunan">

            <div class="label">
                NIRGUNAN
            </div>

            <div class="text">

                Ah. You finally arrived.
                Ask something. I probably won't help.

            </div>

        </div>

    </main>



    <div class="controls">

        <button id="random-button">
            RANDOM QUESTION
        </button>

        <button id="mode-button">
            MODE
        </button>

        <button id="clear-button">
            CLEAR
        </button>

    </div>



    <div id="mode-panel"
         class="mode-panel hidden">

        <div class="mode-heading">
            SELECT MODE
        </div>

        <button class="mode-option active"
                data-mode="USELESS">

            USELESS

        </button>

        <button class="mode-option"
                data-mode="SARCASTIC">

            SARCASTIC

        </button>

        <button class="mode-option"
                data-mode="PHILOSOPHICAL">

            PHILOSOPHICAL

        </button>

        <button class="mode-option"
                data-mode="RANDOM">

            RANDOM

        </button>

        <button class="mode-option"
                data-mode="OVERCONFIDENT">

            OVERCONFIDENT

        </button>

    </div>



    <form id="chat-form"
          class="input-container">

        <input
            id="user-input"
            type="text"
            placeholder="Ask Nirgunan something..."
            autocomplete="off"
        >

        <button id="send-button"
                type="submit">

            →

        </button>

    </form>



    <div class="footer">

        Nirgunan accepts questions.
        Whether it accepts logic is another matter.

    </div>


</section>



<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
